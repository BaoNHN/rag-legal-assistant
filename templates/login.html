<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <style>
  /* ==== CSS GIỮ NGUYÊN ==== */
  @import url('https://fonts.googleapis.com/css?family=Poppins:400,500,600,700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
  html, body {
    margin: 0;
  display: grid;
  height: 100%;
  width: 100%;
  place-items: center;
  background: linear-gradient(to right, #003366, #004080, #0059b3, #0073e6);
}
  .wrapper{max-width:390px;background:#fff;padding:30px;border-radius:15px;box-shadow:0 15px 20px rgba(0,0,0,0.1);}
  .title{font-size:30px;text-align:center;margin-bottom:20px;}

  .field{margin-top:20px;}
  .field input{
    width:100%;height:50px;border-radius:15px;border:1px solid #ccc;
    padding-left:15px;font-size:16px;
  }

  .btn{
    margin-top:20px;
  }
  .btn button{
    width:100%;height:50px;border:none;border-radius:15px;
    background:#0073e6;color:white;font-size:18px;cursor:pointer;
  }
  </style>
</head>

<body>

<div class="wrapper">
  <div class="title">Student Login</div>

  <form id="loginForm">
    <div class="field">
      <input type="text" id="username" placeholder="Student Name" required>
    </div>

    <div class="field">
      <input type="password" id="password" placeholder="Password" required>
    </div>

    <div class="btn">
      <button type="submit">Login</button>
    </div>
  </form>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const student_name = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    try {
        const res = await fetch("/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                student_name: student_name,
                password: password
            })
        });

        if (res.status === 401) {
            alert("Sai tài khoản hoặc mật khẩu");
            return;
        }

        const data = await res.json();

        if (data.status === "success") {
            window.location.href = "/";
        } else {
            alert("Login failed");
        }

    } catch (err) {
        alert("Lỗi server");
        console.error(err);
    }
});
</script>

</body>
</html>
