<!DOCTYPE html>

<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.indigo-pink.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/material-design-icons/3.0.1/iconfont/material-icons.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css')}}"/>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Chat Assistant</title>
</head>
<body>
<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <button class="new-chat">+ New Chat</button>
        </div>

        <div class="sidebar-chats" id="chat-list">
            <!-- chats will appear here -->
        </div>
    </aside>
    <main class="chat-container">
        <div class="header">Chat Assistant</div>
        <div class="container">
            <div id="chatbox" class="chatbox"></div>
            <div class="input-area">
                <input id="chatInput" type="text" placeholder="Type your message"/>
                <button id="sendButton">
                    <span class="material-icons">send</span> Send
                </button>
            </div>
        </div>
    </main>

</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
