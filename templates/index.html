<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous"/>
  <link rel="stylesheet" href="/static/style.css"/>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>RAG Legal Assistant</title>
  <style>
    /* Teacher-only Import Law button */
    .btn-import-law {
      display: none;
      width: 90%;
      margin-right: 30px;
      margin-top: 8px;
      padding: 9px 10px;
      border: 1.5px solid rgb(16 15 15 / 0.5);
      background: #343541;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      transition: all .18s;
      text-decoration: none;
    }
    .btn-import-law:hover {
      background: #40414a;
      border-color: #E8A020;
    }
    .btn-import-law.visible { display: block; }

    .btn-manage-account {
      display: none;
      width: 90%;
      margin-right: 30px;
      margin-top: 8px;
      padding: 9px 10px;
      border: 1.5px solid rgb(16 15 15 / 0.5);
      background: #343541;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      transition: all .18s;
      text-decoration: none;
    }
    .btn-manage-account:hover {
      background: #40414a;
      border-color: #D63B3B;
    }
    .btn-manage-account.visible { display: block; }

    .btn-manage-law {
      display: none;
      width: 90%;
      margin-right: 30px;
      margin-top: 8px;
      padding: 9px 10px;
      border: 1.5px solid rgb(16 15 15 / 0.5);
      background: #343541;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      transition: all .18s;
      text-decoration: none;
    }
    .btn-manage-law:hover {
      background: #40414a;
      border-color: #0DB4A2;
    }
    .btn-manage-law.visible { display: block; }

    /* Role badge in sidebar */
    .role-badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      margin-left: 6px;
      vertical-align: middle;
    }
    .role-badge.teacher {
      background: whitesmoke;
      color: #E8A020;
      border: 1.5px solid #E8A020;
    }
    .role-badge.admin {
      background: whitesmoke;
      color: #D63B3B;
      border: 1.5px solid #D63B3B;
    }
  </style>
</head>
<body>
<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <button class="new-chat">+ Đoạn chat mới</button>
      <!-- Import Law button — shown for teachers & admins via JS -->
      <a href="/import" class="btn-import-law" id="importLawBtn">
        📥 Nhập văn bản luật
      </a>
      <!-- Manage Account button — shown only for admins via JS -->
      <a href="/manage_accounts" class="btn-manage-account" id="manageAccountBtn">
        👤 Quản lý tài khoản
      </a>
      <!-- Manage Law button — shown only for admins via JS -->
      <a href="/manage_law" class="btn-manage-law" id="manageLawBtn">
        🗂️ Quản lý văn bản luật
      </a>
    </div>
    <div class="sidebar-chats" id="chat-list"></div>
  </aside>

  <main class="chat-container">
    <div class="header">
      Chat Assistant
      <span id="roleBadge"></span>
      <button onclick="logout()" style="float:right;background:rgba(255,255,255,0.1);border:none;color:white;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;">Đăng xuất</button>
      <button id="voiceToggle" onclick="toggleVoice()" title="Chuyển đổi giọng trả lời" style="float:right;background:rgba(255,255,255,0.1);border:none;color:white;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;margin-right:8px;"></button>
    </div>
    <div class="container" id="mainContainer">

      <!-- Welcome screen (shown when no messages) -->
      <div id="welcome-screen">
        <h1 class="welcome-title">Chúng ta nên bắt đầu từ đâu?</h1>
        <p class="welcome-subtitle">Đặt câu hỏi về Luật Doanh nghiệp 2020 – 2025</p>
        <div class="suggestion-chips">
          <button class="chip" data-prompt="Cổ đông là gì?">💡 Cổ đông là gì?</button>
          <button class="chip" data-prompt="Thành lập công ty TNHH cần điều kiện gì?">🏢 Thành lập công ty TNHH</button>
          <button class="chip" data-prompt="Doanh nghiệp tạm ngừng kinh doanh cần làm gì?">📋 Tạm ngừng kinh doanh</button>
        </div>
      </div>

      <!-- Chatbox (shown when chatting) -->
      <div id="chatbox" class="chatbox"></div>

      <!-- Input bar — design unchanged -->
      <div class="input-area">
        <input id="chatInput" type="text" placeholder="Nhập câu hỏi về Luật Doanh nghiệp…"/>
        <button id="sendButton">
          <span class="material-icons">send</span> Gửi
        </button>
      </div>

      <!-- Disclaimer text below input -->
      <div id="disclaimer">Trợ lý pháp lý có thể mắc lỗi. Hãy kiểm tra các thông tin pháp lý quan trọng.</div>

    </div>
  </main>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.indigo-pink.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-icons/3.0.1/iconfont/material-icons.css"/>
<script src="/static/script.js"></script>
<script>
// Show Import Law / Manage Account buttons and role badge based on role
(async function() {
  try {
    const res  = await fetch("/session_info");
    const data = await res.json();
    const badge = document.getElementById("roleBadge");

    if (data.user_type === "teacher" || data.user_type === "admin") {
      document.getElementById("importLawBtn").classList.add("visible");
    }
    if (data.user_type === "admin") {
      document.getElementById("manageAccountBtn").classList.add("visible");
      document.getElementById("manageLawBtn").classList.add("visible");
      badge.innerHTML = '<span class="role-badge admin">Quản trị viên</span>';
    } else if (data.user_type === "teacher") {
      badge.innerHTML = '<span class="role-badge teacher">Giảng viên</span>';
    }
  } catch(e) {}
})();
</script>
</body>
</html>
